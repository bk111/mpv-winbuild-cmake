# Copy into .github/workflows/lingomaster.yml in your mpv-winbuild-cmake fork.
# First Linux build is intentionally user-run. This file is not proof of a build.
name: mpv 0.41.0 with corresponding source
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package to build
        required: true
        default: mpv
        type: choice
        options: [mpv, ffmpeg, combined]
permissions:
  contents: write
env:
  RECIPE_COMMIT: cd1edc11dc6887a50f705717619d879f5a93a488
  MPV_TAG: v0.41.0
  MPV_SHA256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
  LIBVPL_COMMIT: 674d015bcb294bc39fa276e99a652ea045423e82
  LIBVPL_PATCH_SHA256: 37cfec93ffd6cdc804d1aa576069d843db590c735165e50a058ad692103a8e26
  BUILD_TARGET: ${{ inputs.target }}
defaults:
  run:
    shell: bash
jobs:
  build:
    if: ${{ inputs.target != 'ffmpeg' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          path: fork
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: shinchiro/mpv-winbuild-cmake
          ref: ${{ env.RECIPE_COMMIT }}
          persist-credentials: false
          path: work/recipes
      - name: Configure Git identity for source patches
        run: |
          set -euo pipefail
          # git am in every dependency checkout needs a committer identity.
          # This global config belongs to the disposable CI runner.
          git config --global user.name "student"
          git config --global user.email "blackantt@gmail.com"
          git var GIT_COMMITTER_IDENT
      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gettext git mercurial subversion \
            ninja-build gyp cmake yasm nasm automake pkgconf libtool libtool-bin \
            gcc-multilib g++-multilib clang lld libgmp-dev libmpfr-dev libmpc-dev \
            libgcrypt20-dev gperf ragel texinfo autopoint re2c asciidoc python3-venv \
            docbook2x unzip p7zip-full curl ccache zstd zip
          python3 -m venv "$RUNNER_TEMP/mpv-python"
          "$RUNNER_TEMP/mpv-python/bin/pip" install meson rst2pdf mako jsonschema
          echo "$RUNNER_TEMP/mpv-python/bin" >> "$GITHUB_PATH"
      - name: Pin mpv and preserve sources after compilation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          recipes = pathlib.Path('work/recipes')
          # intel/libvpl#198, commit 9cb2dc5: avoid old-MSVC macros on MinGW.
          patch = pathlib.Path('fork/.github/patches/libvpl-mingw.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == os.environ['LIBVPL_PATCH_SHA256']
          (recipes / 'packages/libvpl-mingw.patch').write_bytes(patch)
          path = recipes / 'packages/libvpl.cmake'
          text = path.read_text(encoding='utf-8')
          assert text.count('GIT_TAG main') == 1 and 'PATCH_COMMAND' not in text
          text = text.replace('GIT_TAG main', 'GIT_TAG ' + os.environ['LIBVPL_COMMIT'])
          text = text.replace('    UPDATE_COMMAND ""', '    UPDATE_COMMAND ""\n'
              '    PATCH_COMMAND ${EXEC} git am --3way ${CMAKE_CURRENT_SOURCE_DIR}/libvpl-mingw.patch')
          path.write_text(text, encoding='utf-8')
          path = recipes / 'packages/mpv-release.cmake'
          text = path.read_text(encoding='utf-8')
          # This upstream revision has neither build.sh nor MPV_TARBALL.
          # Replace the latest-release redirect with a hash-checked fixed URL.
          marker = 'ExternalProject_Add(mpv-release'
          assert text.count(marker) == 1 and text.count('URL ${LINK}') == 1
          text = text[text.index(marker):].replace('URL ${LINK}',
              'URL https://codeload.github.com/mpv-player/mpv/tar.gz/refs/tags/' + os.environ['MPV_TAG']
              + '\n    URL_HASH SHA256=' + os.environ['MPV_SHA256'])
          # This recipe also targets newer mpv; v0.41.0 has no subrandr option.
          assert os.environ['MPV_TAG'] == 'v0.41.0', 'Recheck release-specific options'
          unsupported = '        -Dsubrandr=enabled\n'
          assert text.count(unsupported) == 1, 'mpv subrandr option patch no longer matches'
          text = text.replace(unsupported, '')
          # v0.41.0 links getVSScriptAPI directly; this header-only recipe cannot supply it.
          # The language-learning player does not use VapourSynth filter scripts.
          vapoursynth_option = '        -Dvapoursynth=enabled\n'
          assert text.count(vapoursynth_option) == 1, 'mpv VapourSynth option patch no longer matches'
          text = text.replace(vapoursynth_option, '        -Dvapoursynth=disabled\n')
          vapoursynth_dependency = '        vapoursynth\n'
          assert text.count(vapoursynth_dependency) == 1, 'mpv VapourSynth dependency patch no longer matches'
          text = text.replace(vapoursynth_dependency, '')
          command = 'BUILD_COMMAND ${EXEC} LTO_JOB=1 ninja -C <BINARY_DIR>'
          assert text.count(command) == 1, 'mpv verbose build patch no longer matches'
          text = text.replace(command, command.replace('ninja -C', 'ninja -v -C'))
          assert text.count('    LOG_DOWNLOAD 1') == 1
          text = text.replace('    LOG_DOWNLOAD 1', '    LOG_OUTPUT_ON_FAILURE 1\n    LOG_DOWNLOAD 1')
          path.write_text(text, encoding='utf-8')
          path = recipes / 'cmake/custom_steps.cmake'
          text, count = re.subn(r'    ExternalProject_Add_Step\(\$\{_name\} postremovebuild\n.*?\n    \)\n',
                               '', path.read_text(encoding='utf-8'), flags=re.S)
          assert count == 1, 'Source-preservation patch no longer matches'
          path.write_text(text, encoding='utf-8')
          PY
          mkdir -p work/provenance
          if [ "$BUILD_TARGET" = combined ]; then
            python3 fork/.github/scripts/media_portable_build.py prepare
            cp fork/.github/scripts/media_portable_build.py work/provenance/
          fi
          cp fork/.github/workflows/lingomaster.yml work/provenance/workflow.yml
          git -C work/recipes diff --binary > work/provenance/recipe.patch
          dpkg-query -W > work/provenance/host-packages.txt
          pip freeze > work/provenance/python-build-tools.txt
          # GCC is an upstream-supported, shorter cold build; generic x86-64 ISA.
          cmake -G Ninja -S work/recipes -B work/build \
            -DTARGET_ARCH=x86_64-w64-mingw32 -DGCC_ARCH=x86-64 \
            -DSINGLE_SOURCE_LOCATION="$GITHUB_WORKSPACE/work/src_packages" \
            -DRUSTUP_LOCATION="$GITHUB_WORKSPACE/work/install_rustup"
      - name: Compile toolchain and fixed mpv release
        # Leave time within the 350-minute job for diagnostic collection/upload.
        timeout-minutes: 330
        run: |
          set -euo pipefail
          mkdir -p work/logs
          ninja -v -C work/build gcc 2>&1 | tee work/logs/gcc.log
          ninja -v -C work/build rustup 2>&1 | tee work/logs/rustup.log
          ninja -v -C work/build mpv-release 2>&1 | tee work/logs/mpv-release.log
          test -f work/build/mpv-0.41.0-x86_64/mpv.exe
          test "$(cat work/src_packages/mpv-release/MPV_VERSION)" = 0.41.0
      - name: Package combined executables and gate portable imports
        if: ${{ inputs.target == 'combined' }}
        run: |
          set -euo pipefail
          python3 fork/.github/scripts/media_portable_build.py package 2>&1 | tee work/logs/portable-package.log
      - name: Upload portable import report
        if: ${{ always() && inputs.target == 'combined' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-imports-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/provenance/portable-imports.json
          if-no-files-found: warn
          retention-days: 14
      - name: Collect detailed build logs
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('work')
          output = pathlib.Path('diagnostics')
          output.mkdir(exist_ok=True)
          files, errors = [], []
          config_names = {'config.log', 'meson-log.txt', 'CMakeConfigureLog.yaml',
                          'CMakeOutput.log', 'CMakeError.log'}
          # Only known build-log types from this disposable runner workspace.
          # Preserve full bytes and relative paths, including empty stderr logs.
          for directory in ('logs', 'build', 'src_packages'):
              start = root / directory
              if start.is_symlink() or not start.is_dir():
                  continue
              for base, dirs, names in os.walk(start, followlinks=False):
                  base = pathlib.Path(base)
                  dirs[:] = sorted(d for d in dirs if not d.startswith('.')
                                   and not (base / d).is_symlink())
                  for name in sorted(names):
                      path = base / name
                      if name.startswith('.') or path.is_symlink() or not path.is_file():
                          continue
                      relative = path.relative_to(root)
                      stamp_log = any(p.endswith('-stamp') for p in relative.parts[:-1]) and name.endswith('.log')
                      outer_log = directory == 'logs' and name.endswith('.log')
                      if not (stamp_log or outer_log or name in config_names):
                          continue
                      try:
                          destination = output / relative
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(path, destination)
                          with destination.open('rb') as stream:
                              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                          files.append({'path': relative.as_posix(),
                                        'bytes': destination.stat().st_size, 'sha256': digest})
                      except OSError as exc:
                          errors.append({'path': relative.as_posix(), 'error': str(exc)})
          manifest = {'run_id': os.environ['GITHUB_RUN_ID'], 'files': files,
                      'collection_errors': errors, 'empty': not files}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (output / 'SHA256SUMS').write_text(
              ''.join(f"{row['sha256']}  {row['path']}\n" for row in files), encoding='utf-8')
          print(f"[OK] Preserved {len(files)} complete build logs; collection errors: {len(errors)}")
          if errors:
              raise RuntimeError('Some logs could not be collected; see diagnostics/manifest.json')
          PY
      - name: Upload detailed build logs
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mpv-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Archive corresponding sources and build provenance
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path('work')
          package = root / 'build/mpv-0.41.0-x86_64'
          manifest = {'schema_version': 2, 'mpv_tag': os.environ['MPV_TAG'],
                      'recipe_commit': os.environ['RECIPE_COMMIT'],
                      'mpv_tarball_sha256': os.environ['MPV_SHA256'],
                      'git': [], 'files': [], 'symlinks': []}
          def git(path, *args):
              return subprocess.check_output(['git', '-C', str(path), *args],
                  text=True, encoding='utf-8').rstrip('\n')
          included = ('src_packages', 'recipes', 'provenance')
          for name in included:
              assert (root / name).is_dir() and any((root / name).iterdir()), name
          source_roots = [(root / name).resolve() for name in included]
          def in_source(path):
              return any(path.is_relative_to(directory) for directory in source_roots)
          # Recipes link separately fetched sources into submodule paths. Make
          # runner-absolute links relocatable while retaining their original form.
          # Autotools may also link host helper files: preserve their actual bytes.
          for name in included:
              for base, dirs, files in os.walk(root / name, followlinks=False):
                  dirs[:] = sorted(d for d in dirs if d != '.git')
                  for filename in sorted(dirs + files):
                      link = pathlib.Path(base) / filename
                      if filename == '.git' or not link.is_symlink():
                          continue
                      original = os.readlink(link)
                      target = link.resolve()
                      row = {'path': link.relative_to(root).as_posix(),
                             'original_target': original}
                      if in_source(target):
                          relative = pathlib.Path(os.path.relpath(target, link.parent)).as_posix()
                          row.update(archive_target=relative,
                              source_target=target.relative_to(root.resolve()).as_posix(),
                              dangling=not target.exists(), materialized=False)
                          if original != relative:
                              is_directory = target.is_dir()
                              link.unlink()
                              link.symlink_to(pathlib.Path(relative), target_is_directory=is_directory)
                      elif target.is_file():
                          content, mode = target.read_bytes(), target.stat().st_mode
                          link.unlink()
                          link.write_bytes(content)
                          link.chmod(mode)
                          row.update(archive_target=None, materialized=True,
                              sha256=hashlib.sha256(content).hexdigest())
                      else:
                          raise RuntimeError(f'Source link target cannot be archived: {link} -> {original}')
                      manifest['symlinks'].append(row)
          def git_provenance(path):
              # Do not ask Git to enter symlink-replaced submodules. Record both
              # HEAD/index gitlinks explicitly; walk real nested checkouts below.
              head, index = {}, {}
              for entry in git(path, 'ls-tree', '-r', '-z', 'HEAD').split('\0'):
                  if entry:
                      metadata, filename = entry.split('\t', 1)
                      mode, kind, commit = metadata.split()
                      if mode == '160000':
                          head[filename] = commit
              for entry in git(path, 'ls-files', '--stage', '-z').split('\0'):
                  if entry:
                      metadata, filename = entry.split('\t', 1)
                      mode, commit, stage = metadata.split()
                      assert stage == '0', f'Unmerged source index: {path}/{filename}'
                      if mode == '160000':
                          index[filename] = commit
              submodules = []
              for filename in sorted(head.keys() | index.keys()):
                  child = path / filename
                  row = {'path': filename, 'head_commit': head.get(filename),
                         'index_commit': index.get(filename)}
                  if child.is_symlink():
                      target = child.resolve(strict=True)
                      assert target.is_dir() and in_source(target), f'Missing submodule source: {child}'
                      row.update(state='source_symlink', target=os.readlink(child),
                          source_path=target.relative_to(root.resolve()).as_posix())
                      if (target / '.git').exists():
                          row['actual_commit'] = git(target, 'rev-parse', 'HEAD')
                  elif (child / '.git').exists():
                      row.update(state='checkout', actual_commit=git(child, 'rev-parse', 'HEAD'))
                  else:
                      row['state'] = 'directory' if child.is_dir() else 'absent'
                  submodules.append(row)
              return {'path': path.relative_to(root).as_posix(),
                  'commit': git(path, 'rev-parse', 'HEAD'),
                  'status': git(path, 'status', '--porcelain=v1', '--untracked-files=all',
                                '--ignore-submodules=all'),
                  'patch': git(path, 'diff', '--binary', '--no-ext-diff', '--no-textconv',
                               '--ignore-submodules=all', 'HEAD'),
                  'submodules': submodules}
          toolchain = []
          for directory in (root / 'build', root / 'install_rustup'):
              for base, dirs, files in os.walk(directory):
                  if pathlib.Path(base).name != 'bin':
                      continue
                  for name in sorted(files):
                      if not (name.endswith(('-gcc', '-g++', '-ld', '-ar'))
                              or name in ('rustc', 'cargo')):
                          continue
                      path = pathlib.Path(base) / name
                      if not path.is_file():
                          continue
                      with path.open('rb') as stream:
                          digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                      version = subprocess.run([str(path.resolve()), '--version'],
                          capture_output=True, text=True, errors='replace', timeout=30)
                      toolchain.append({'path': str(path.relative_to(root)), 'sha256': digest,
                                        'version': version.stdout, 'returncode': version.returncode})
          assert toolchain, 'No toolchain provenance found'
          (root / 'provenance/toolchain.json').write_text(
              json.dumps(toolchain, indent=2) + '\n', encoding='utf-8')
          for name in included:
              for base, dirs, files in os.walk(root / name):
                  path = pathlib.Path(base)
                  if '.git' in dirs or '.git' in files:
                      manifest['git'].append(git_provenance(path))
                  # The tar includes .git, patched source trees and downloads.
                  # Installed toolchains and build objects are not source payload.
                  dirs[:] = [d for d in dirs if d != '.git']
                  for filename in sorted(files):
                      file = path / filename
                      if file.is_symlink() or not file.is_file():
                          continue
                      with file.open('rb') as stream:
                          digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                      manifest['files'].append({'path': str(file.relative_to(root)), 'sha256': digest})
          (root / 'versions.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          shutil.copy2(root / 'versions.json', 'output/versions.json')
          shutil.copy2(root / 'src_packages/ffmpeg/COPYING.GPLv3', 'output/GPL-3.0.txt')
          shutil.copy2('output/GPL-3.0.txt', package / 'GPL-3.0.txt')
          shutil.copy2(root / 'src_packages/mpv-release/Copyright', package / 'Copyright')
          tag = 'lingomaster-mpv-0.41.0-' + os.environ['GITHUB_RUN_ID']
          source_url = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tag/' + tag
          (package / 'SOURCE.txt').write_text('mpv and linked GPL components: GPL-3.0.\n'
              'Full corresponding source, patches, versions and build instructions: ' + source_url + '\n'
              'Source archive contains source packages, recipes and provenance; see work/provenance/workflow.yml.\n'
              'For split archives follow SOURCE_RESTORE.txt and verify SHA256SUMS.\n', encoding='utf-8')
          PY
          if [ "$BUILD_TARGET" = combined ]; then
            python3 fork/.github/scripts/media_portable_build.py finish
          fi
          (cd work/build/mpv-0.41.0-x86_64 && zip -qr "$GITHUB_WORKSPACE/output/mpv-0.41.0-x86_64.zip" .)
          source="$RUNNER_TEMP/mpv-0.41.0-corresponding-source.tar.zst"
          tar -I 'zstd -T0 -3' -cf "$source" \
            work/src_packages work/recipes work/provenance work/versions.json
          (cd "$RUNNER_TEMP" && sha256sum mpv-0.41.0-corresponding-source.tar.zst) > output/SOURCE_SHA256
          if [ "$(stat -c %s "$source")" -gt 1887436800 ]; then
            split -b 1800M -d --suffix-length=3 "$source" output/mpv-0.41.0-corresponding-source.tar.zst.part
          else
            mv "$source" output/
          fi
          cat > output/SOURCE_RESTORE.txt <<'EOF'
          Verify downloaded assets with: sha256sum -c SHA256SUMS
          If .partNNN files are present, concatenate in numeric order:
            cat mpv-0.41.0-corresponding-source.tar.zst.part* > mpv-0.41.0-corresponding-source.tar.zst
          Verify the complete archive with: sha256sum -c SOURCE_SHA256
          Extract with: tar -I zstd -xf mpv-0.41.0-corresponding-source.tar.zst
          Build instructions: work/provenance/workflow.yml
          Source paths: work/src_packages, work/recipes, work/provenance, work/versions.json
          Preserve symbolic links when extracting (use Linux or WSL). versions.json
          records original links, archive-relative targets, materialized host helper
          files, and HEAD/index/actual submodule revisions. Real linked sources and
          nested Git checkouts are included; git diff intentionally excludes gitlinks.
          Installed compiler binaries and build objects are excluded. Compiler sources,
          exact source revisions, patches, host packages and compiler hashes are recorded.
          EOF
          (cd output && sha256sum mpv-* GPL-3.0.txt versions.json SOURCE_SHA256 SOURCE_RESTORE.txt > SHA256SUMS)
          if [ "$BUILD_TARGET" = combined ]; then
            (cd output && sha256sum ffmpeg-windows-x64.zip portable-imports.json >> SHA256SUMS)
          fi
      - name: Upload combined binaries for clean Windows smoke
        if: ${{ inputs.target == 'combined' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-windows-packages
          path: |
            output/mpv-0.41.0-x86_64.zip
            output/ffmpeg-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mpv-binary-and-corresponding-source
          path: output/*
          if-no-files-found: error
      - name: Create reviewable draft with binary and source together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "lingomaster-mpv-0.41.0-$GITHUB_RUN_ID" output/* \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title 'LingoMaster mpv 0.41.0 - pending validation' \
            --notes 'Binary, corresponding sources, build recipes, provenance, GPL text and hashes are attached together. SOURCE_RESTORE.txt describes split archive reconstruction. Validate Windows playback and source completeness before publishing or syncing to R2.'

  windows_smoke:
    if: ${{ inputs.target == 'combined' }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          path: fork
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: combined-windows-packages
          path: packages
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Smoke portable packages without developer PATH or drivers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python fork/.github/scripts/media_portable_build.py smoke --root packages --output smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload complete smoke logs and hashes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            smoke/*.log
            smoke/*.json
            smoke/*.mp4
            smoke/*.mp3
            smoke/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  ffmpeg:
    if: ${{ inputs.target == 'ffmpeg' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          path: fork
      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gettext git mercurial subversion \
            ninja-build gyp cmake yasm nasm automake pkgconf libtool libtool-bin \
            gcc-multilib g++-multilib clang lld libgmp-dev libmpfr-dev libmpc-dev \
            libgcrypt20-dev gperf ragel texinfo autopoint re2c asciidoc python3-venv \
            docbook2x unzip p7zip-full curl ccache zstd zip
          python3 -m venv "$RUNNER_TEMP/mpv-python"
          "$RUNNER_TEMP/mpv-python/bin/pip" install meson rst2pdf mako jsonschema
          echo "$RUNNER_TEMP/mpv-python/bin" >> "$GITHUB_PATH"
      - name: Restore verified mpv source closure and prepare ffmpeg
        run: |
          set -euo pipefail
          git config --global user.name "student"
          git config --global user.email "blackantt@gmail.com"
          curl --fail --location --retry 3 --output source.tar.zst \
            https://download.lingomaster.io/tools/mpv-ipc/0.41.0-35124922360/mpv-0.41.0-corresponding-source.tar.zst
          echo '1945ba456cac3c813637f119ed5356a8217d407974567f0811777852f3104f9c  source.tar.zst' | sha256sum -c -
          tar -I zstd -xf source.tar.zst
          mkdir -p work/build/cmake/Modules/ExternalProject work/logs work/ffmpeg-provenance
          unzip -q work/recipes/cmake/CMake-v3.31.6-Modules-ExternalProject.zip -d work/build/cmake/Modules/ExternalProject
          curl --fail --location --retry 3 --output work/build/cmake/Modules/ExternalProject.cmake \
            https://raw.githubusercontent.com/Kitware/CMake/v3.31.6/Modules/ExternalProject.cmake
          echo '303d2222b3b39df5e94997ec64a07f6877bbf5297978bf3134347389200da695  work/build/cmake/Modules/ExternalProject.cmake' | sha256sum -c -
          (cd work/build/cmake && patch -p1 -i ../../recipes/packages/cmake-0001-ExternalProject-changes.patch)
          touch work/build/cmake/Modules/setup_done
          python3 fork/.github/scripts/ffmpeg_from_mpv.py prepare --module work/build/cmake/Modules/ExternalProject.cmake
          cp fork/.github/workflows/lingomaster.yml work/ffmpeg-provenance/workflow.yml
          cp fork/.github/scripts/ffmpeg_from_mpv.py work/ffmpeg-provenance/
          cp work/build/cmake/Modules/ExternalProject.cmake work/ffmpeg-provenance/ExternalProject.cmake
          dpkg-query -W > work/ffmpeg-provenance/host-packages.txt
          pip freeze > work/ffmpeg-provenance/python-build-tools.txt
          cmake -G Ninja -S work/recipes -B work/build \
            -DTARGET_ARCH=x86_64-w64-mingw32 -DGCC_ARCH=x86-64 \
            -DSINGLE_SOURCE_LOCATION="$GITHUB_WORKSPACE/work/src_packages" \
            -DRUSTUP_LOCATION="$GITHUB_WORKSPACE/work/install_rustup" 2>&1 | tee work/logs/cmake.log
      - name: Compile static ffmpeg and ffprobe once
        timeout-minutes: 320
        run: |
          set -euo pipefail
          ninja -v -C work/build gcc 2>&1 | tee work/logs/gcc.log
          ninja -v -C work/build rustup 2>&1 | tee work/logs/rustup.log
          ninja -v -C work/build ffmpeg 2>&1 | tee work/logs/ffmpeg.log
      - name: Package ffmpeg and source supplement
        run: |
          set -euo pipefail
          python3 fork/.github/scripts/ffmpeg_from_mpv.py package
      - name: Collect detailed build logs
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('work')
          output = pathlib.Path('diagnostics')
          output.mkdir(exist_ok=True)
          files, errors = [], []
          config_names = {'config.log', 'meson-log.txt', 'CMakeConfigureLog.yaml',
                          'CMakeOutput.log', 'CMakeError.log'}
          # Only known build-log types from this disposable runner workspace.
          # Preserve full bytes and relative paths, including empty stderr logs.
          for directory in ('logs', 'build', 'src_packages'):
              start = root / directory
              if start.is_symlink() or not start.is_dir():
                  continue
              for base, dirs, names in os.walk(start, followlinks=False):
                  base = pathlib.Path(base)
                  dirs[:] = sorted(d for d in dirs if not d.startswith('.')
                                   and not (base / d).is_symlink())
                  for name in sorted(names):
                      path = base / name
                      if name.startswith('.') or path.is_symlink() or not path.is_file():
                          continue
                      relative = path.relative_to(root)
                      stamp_log = any(p.endswith('-stamp') for p in relative.parts[:-1]) and name.endswith('.log')
                      outer_log = directory == 'logs' and name.endswith('.log')
                      if not (stamp_log or outer_log or name in config_names):
                          continue
                      try:
                          destination = output / relative
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(path, destination)
                          with destination.open('rb') as stream:
                              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                          files.append({'path': relative.as_posix(),
                                        'bytes': destination.stat().st_size, 'sha256': digest})
                      except OSError as exc:
                          errors.append({'path': relative.as_posix(), 'error': str(exc)})
          manifest = {'run_id': os.environ['GITHUB_RUN_ID'], 'files': files,
                      'collection_errors': errors, 'empty': not files}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (output / 'SHA256SUMS').write_text(
              ''.join(f"{row['sha256']}  {row['path']}\n" for row in files), encoding='utf-8')
          print(f"[OK] Preserved {len(files)} complete build logs; collection errors: {len(errors)}")
          if errors:
              raise RuntimeError('Some logs could not be collected; see diagnostics/manifest.json')
          PY
      - name: Upload detailed build logs
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-binary-and-source-supplement
          path: output/*
          if-no-files-found: error
          retention-days: 14
      - name: Create ffmpeg-only reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "lingomaster-ffmpeg-$GITHUB_RUN_ID" output/*.zip output/*.gz output/*.json output/*.txt output/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title 'LingoMaster ffmpeg - pending validation' \
            --notes 'Static ffmpeg and ffprobe built from the verified source archive shared with mpv 0.41.0 run 35124922360. SOURCE.json pins the existing public archive and the attached source/build supplement. Validate Windows encoders, hardware probes, ffprobe and complete source provenance before publication.'
